services:
  postgres-db:
    image: postgres:16-alpine
    container_name: meu-postgres-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fisiocare_local}
      - POSTGRES_DB=fisiocare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fisiocare"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data-local:/var/lib/postgresql/data

  api-spring:
    container_name: minha-api
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/fisiocare
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-fisiocare_local}
      - JWT_SECRET=${JWT_SECRET:-jwt-local-apenas-para-testes}
      - ADMIN_SECRET=${ADMIN_SECRET:-chave-local-apenas-para-testes}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres-data-local:
