spring.application.name=gerenciadorfisio

# No Render, configure DB_URL (JDBC), DB_USERNAME e DB_PASSWORD.
# Nunca grave credenciais reais neste arquivo versionado.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fisiocare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.expiracao=120
spring.secret=${JWT_SECRET:}
spring.admin-secret=${ADMIN_SECRET:}
spring.emissor=karen
