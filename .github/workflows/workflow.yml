name: CI/CD Docker Build and Test

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir e iniciar os serviços
        run: docker compose up -d --build

      - name: Verificar API e Swagger
        run: |
          echo "Aguardando o backend inicializar..."
          for i in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/v3/api-docs > /dev/null; then
              echo "Swagger disponível"
              exit 0
            fi
            sleep 3
          done
          docker compose logs api-spring
          exit 1

      - name: Exibir status e logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100 postgres-db api-spring

      - name: Parar os contêineres
        if: always()
        run: docker compose down -v
